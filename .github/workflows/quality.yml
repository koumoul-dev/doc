name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout git repository
      uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm

    # also runs puppeteer's postinstall, which downloads the Chrome used by the export command
    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Type check
      run: npm run typecheck

    - name: Build
      run: npm run build

    - name: Unit tests
      run: npm run test

    # the system packages it pulls also cover puppeteer's Chrome
    - name: Install playwright browser
      run: npx playwright install --with-deps chromium

    - name: E2E tests
      run: npm run test:e2e

    - name: Audit
      run: npm audit --omit=dev --audit-level=critical

    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: test-results/
        retention-days: 7
